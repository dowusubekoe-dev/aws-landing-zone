name: Terraform Validate & Plan

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  TF_VERSION: "1.9.0"
  AWS_REGION:  "us-east-1"

jobs:
  # ── Job 1: Format check ──────────────────────────────────────────────────
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

  # ── Job 2: Validate — syntax only, no real AWS calls ────────────────────
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      matrix:
        module: [account-baseline, transit-gateway, monitoring]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Write dummy tfvars
        working-directory: terraform/${{ matrix.module }}
        run: |
          cat > terraform.tfvars << 'TFVARS'
          management_account_id = "000000000001"
          dev_account_id        = "000000000002"
          prod_account_id       = "000000000003"
          ops_email             = "noreply@example.com"
          config_bucket_name    = "dummy-config-bucket"
          dr_ami_id             = "ami-00000000000000000"
          dr_private_subnet_ids = ["subnet-00000000000000001"]
          prod_db_endpoint      = "dummy.rds.amazonaws.com"
          TFVARS

      - name: Terraform Init
        working-directory: terraform/${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/${{ matrix.module }}
        run: terraform validate

      - name: Clean up dummy tfvars
        if: always()
        working-directory: terraform/${{ matrix.module }}
        run: rm -f terraform.tfvars

  # ── Job 3: Plan on PRs ───────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        module: [account-baseline, transit-gateway, monitoring]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Write tfvars from secrets
        working-directory: terraform/${{ matrix.module }}
        run: |
          cat > terraform.tfvars << TFVARS
          management_account_id = "${{ secrets.MANAGEMENT_ACCOUNT_ID }}"
          dev_account_id        = "${{ secrets.DEV_ACCOUNT_ID }}"
          prod_account_id       = "${{ secrets.PROD_ACCOUNT_ID }}"
          ops_email             = "${{ secrets.OPS_EMAIL }}"
          config_bucket_name    = "${{ secrets.CONFIG_BUCKET_NAME }}"
          dr_ami_id             = "${{ secrets.DR_AMI_ID }}"
          prod_db_endpoint      = "${{ secrets.PROD_DB_ENDPOINT }}"
          TFVARS

      - name: Terraform Init
        working-directory: terraform/${{ matrix.module }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/${{ matrix.module }}
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs  = require('fs');
            const raw = fs.readFileSync('terraform/${{ matrix.module }}/plan_output.txt', 'utf8');
            const body = `## Terraform Plan — \`${{ matrix.module }}\`
            <details><summary>Click to expand</summary>

            \`\`\`hcl
            ${raw.length > 60000 ? raw.substring(0, 60000) + '\n...truncated...' : raw}
            \`\`\`
            </details>
            *@${{ github.actor }} on \`${{ github.head_ref }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body
            });

      - name: Clean up tfvars
        if: always()
        working-directory: terraform/${{ matrix.module }}
        run: rm -f terraform.tfvars